<!DOCTYPE html><html><body style="margin:0;background:#9cc3e2"><canvas id=c width=1400 height=900></canvas>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type=module>
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});r.setScissorTest(true);r.toneMapping=THREE.ACESFilmicToneMapping;
const sc=new THREE.Scene();sc.background=new THREE.Color(0x9cc3e2);sc.add(new THREE.HemisphereLight(0xcfe6ff,0x5a5a48,1.3));const s=new THREE.DirectionalLight(0xfff2dc,2.2);s.position.set(-.5,.8,.35);sc.add(s);
const L=new GLTFLoader();L.setMeshoptDecoder(MeshoptDecoder);
const lod=+(new URLSearchParams(location.search).get('lod')||0);
L.load('../assets/mig29.glb',g=>{sc.add(g.scene);for(const n of ['LOD0','LOD1','LOD2','LOD3']){const o=g.scene.getObjectByName(n);if(o)o.visible=(n==='LOD'+lod)}
 const st={};g.scene.traverse(o=>{if(o.isMesh){st.meshes=(st.meshes||0)+1}});
 const cam=new THREE.PerspectiveCamera(30,1,0.5,500);
 const V=[[[-27,9,-25],[0,0,0],30],[[0,62,0.01],[0,0,0],30],[[46,1,0],[0,0,0],30],[[16,6,30],[0,0,0],30],[[-6.5,2.2,-11],[0,0.3,-4.5],30],[[9,-6,4],[0,-0.6,1],34]];
 V.forEach((v,i)=>{const w=466,h=450,x=(i%3)*w,y=(1-Math.floor(i/3))*h;r.setViewport(x,y,w,h);r.setScissor(x,y,w,h);cam.aspect=w/h;cam.fov=v[2];cam.updateProjectionMatrix();cam.position.set(...v[0]);cam.up.set(0,1,0);if(i===1)cam.up.set(0,0,-1);cam.lookAt(...v[1]);r.render(sc,cam)});
 window.done=JSON.stringify(st)},undefined,e=>{window.done='ERR '+e});
</script></body></html>
